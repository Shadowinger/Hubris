name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Unit tests
        run: dotnet test tests/Hubris.Tests -c Release --nologo -v q --logger "console;verbosity=normal"

      - name: Publish server (Native AOT, zero warnings)
        shell: bash
        run: |
          set +e
          dotnet publish src/Hubris -c Release --nologo > publish.log 2>&1
          status=$?
          set -e
          tail -n 5 publish.log
          [ "$status" -eq 0 ] || { cat publish.log; exit 1; }
          if grep -qE "warning|error" publish.log; then grep -E "warning|error" publish.log | sort -u; exit 1; fi
          bin=$(find src/Hubris/bin -type f \( -name Hubris -o -name Hubris.exe \) -path '*publish*' | head -1)
          if [ -z "$bin" ]; then echo "no published binary found:"; find src/Hubris/bin -maxdepth 5 | head -40; exit 1; fi
          echo "HUBRIS_BIN=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: E2E over stdio and the control socket
        if: runner.os != 'Windows'   # the Python client uses AF_UNIX, which CPython lacks on Windows
        shell: bash
        run: |
          export HUBRIS_HOME="$(mktemp -d)"
          python3 -I tests/e2e/control_test.py "$HUBRIS_BIN"
          python3 -I tests/e2e/cli_test.py "$HUBRIS_BIN"
          tests/e2e/install_test.sh "$HUBRIS_BIN"

      - name: E2E over HTTP
        shell: bash
        run: |
          export HUBRIS_HOME="$(mktemp -d)"
          python -I tests/e2e/http_test.py "$HUBRIS_BIN"

      - name: Build desktop
        run: dotnet build src/Hubris.Desktop -c Release --nologo
